name: Contribution snake

on:
  schedule: [{ cron: "0 19 * * *" }]   # 02:00 Ha Noi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake/snake-dark.svg?palette=github-dark
            assets/snake/snake-light.svg?palette=github-light

      - name: Commit generated snake
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/snake
          git diff --staged --quiet || git commit -m "chore: regenerate contribution snake"
          git pull --rebase origin main
          git push
