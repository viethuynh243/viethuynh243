name: Metrics

# Every step below needs METRICS_TOKEN: a classic PAT with `repo` + `read:user`,
# saved as a repository secret. Without it the whole workflow fails at the first step.
# See SETUP.md.

on:
  schedule: [{ cron: "0 18 * * *" }]   # 01:00 Ha Noi
  workflow_dispatch:
  push: { branches: [main] }

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      # 1. Overview: header, activity, community, repositories
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          repositories_affiliations: owner
          repositories_forks: no
          plugin_lines: yes
          plugin_lines_sections: base

      # 2. Isometric contribution calendar
      - name: Isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3. Languages, in depth, forks and prose excluded
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: markdown, tex, jupyter notebook, html, css, roff
          plugin_languages_limit: 12
          plugin_languages_details: percentage, bytes-size, lines
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_colors: github

      # 4. Coding habits: when and how I work
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.habits.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # 5. Achievements and notable contributions
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      # 6. Repository topics I work across
      - name: Topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.topics.svg
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
