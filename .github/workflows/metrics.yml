name: Metrics

# Needs METRICS_TOKEN: a classic PAT with `repo` + `read:user`, saved as a repository
# secret. See SETUP.md.
#
# Each step is continue-on-error so one bad plugin cannot take the rest down, and
# plugins_errors_fatal is off so a single failing sub-plugin degrades that one card
# instead of the whole render. The `activity` and `community` base sections are left
# out: they read event actor logins and hit a null on this account.

on:
  schedule: [{ cron: "0 18 * * *" }]   # 01:00 Ha Noi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      - name: Overview
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.overview.svg
          template: classic
          base: header, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          repositories_affiliations: owner
          repositories_forks: no
          plugins_errors_fatal: no
          plugin_lines: yes
          plugin_lines_sections: base

      - name: Isocalendar
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugins_errors_fatal: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.languages.svg
          base: ""
          plugins_errors_fatal: no
          plugin_languages: yes
          plugin_languages_ignored: markdown, tex, jupyter notebook, html, css, roff
          plugin_languages_limit: 12
          plugin_languages_details: percentage, bytes-size
          plugin_languages_sections: most-used
          plugin_languages_colors: github

      - name: Habits
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.habits.svg
          base: ""
          config_timezone: Asia/Ho_Chi_Minh
          plugins_errors_fatal: no
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Achievements
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.achievements.svg
          base: ""
          plugins_errors_fatal: no
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

      - name: Topics
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: metrics.topics.svg
          base: ""
          plugins_errors_fatal: no
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
