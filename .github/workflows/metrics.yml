name: Metrics

on:
  schedule: [{ cron: "0 18 * * *" }]   # 01:00 Ha Noi
  workflow_dispatch:
  push: { branches: [main] }

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Classic PAT with `repo` scope, saved as repo secret METRICS_TOKEN.
          # Without it the card shows public repositories only.
          token: ${{ secrets.METRICS_TOKEN }}
          user: viethuynh243
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh
          repositories_affiliations: owner
          repositories_forks: no

          plugin_languages: yes
          plugin_languages_ignored: markdown, tex, jupyter notebook, html, css
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size
          plugin_languages_sections: most-used
          plugin_languages_colors: github

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_lines: yes
          plugin_lines_sections: base

          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
