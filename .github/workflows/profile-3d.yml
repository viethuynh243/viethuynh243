name: 3D contribution calendar

on:
  schedule: [{ cron: "30 18 * * *" }]   # 01:30 Ha Noi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          # Falls back to GITHUB_TOKEN, which sees public contributions only.
          # METRICS_TOKEN (classic PAT, `repo` scope) includes private ones.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: regenerate 3D contribution calendar"
          git push
