  </pattern>
  <pattern id="a-h1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="6" fill="#0b57d0"/></pattern>
  <pattern id="a-h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="6" fill="#137333"/></pattern>
  <pattern id="a-h3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="6" fill="#b06000"/></pattern>
  <pattern id="a-h4" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="6" fill="#7b1fa2"/></pattern>
  <pattern id="a-h5" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="6" fill="#c5221f"/></pattern>
  <pattern id="a-h6" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="6" fill="#00747a"/></pattern>
  <pattern id="a-h7" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="6" fill="#a6357a"/></pattern>
  <pattern id="a-h8" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.4" height="6" fill="#8a6d00"/></pattern>
  <style>
    .lvl { animation: level 10s ease-in-out infinite; }
    @keyframes level { 0%,100%{transform:translateX(0)} 50%{transform:translateX(1000px)} }
    @media (prefers-reduced-motion: reduce){ .lvl{animation:none} }
  </style>
</defs>

