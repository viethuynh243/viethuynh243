<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Commits I authored per repository, drawn as a skyline under construction: tieu-mich 583, MCOC Python 460, STEMSquad 225, OptApp 53, CoreBIM-AI 48, TEDI-Vision 28, slay-hub 23, TEDI-BRAIN 16">
<defs>
  <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#080d1e"/><stop offset="1" stop-color="#16244c"/>
  </linearGradient>
  <linearGradient id="a-glow" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#3fb950" stop-opacity=".22"/>
    <stop offset=".55" stop-color="#1f6feb" stop-opacity=".14"/>
    <stop offset="1" stop-color="#f85149" stop-opacity=".10"/>
  </linearGradient>
  <pattern id="a-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#8fb0ff" stroke-opacity=".06"/>
  </pattern>
  <style>
    /* Bars run once and hold: they carry data, so a loop would show wrong heights
       most of the time. Windows, crane and floodlight keep looping, they are scenery. */
    .b    { transform-origin: center bottom; animation: grow 1.7s cubic-bezier(.2,.85,.3,1) .15s 1 both; }
    .w    { animation: lamp 6s ease-in-out 1.6s infinite; }
    .jib  { transform-origin: 148px 68px; animation: slew 9s ease-in-out infinite; }
    .load { animation: lift 9s ease-in-out infinite; }
    .beam { animation: sweep 6s ease-in-out infinite; }
    @keyframes grow  { from{transform:scaleY(.02)} to{transform:scaleY(1)} }
    @keyframes lamp  { 0%,100%{opacity:1} 50%{opacity:.45} }
    @keyframes slew  { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(9deg)} }
    @keyframes lift  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(46px)} }
    @keyframes sweep { 0%,100%{opacity:.15} 50%{opacity:.5} }
    @media (prefers-reduced-motion: reduce){ .b,.w,.jib,.load,.beam{animation:none} }
  </style>
</defs>

<rect width="1200" height="330" rx="10" fill="url(#a-sky)"/>
<rect width="1200" height="330" rx="10" fill="url(#a-glow)"/>
<rect width="1200" height="330" rx="10" fill="url(#a-grid)"/>

<text x="34" y="34" fill="#e6edf3" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600">Commits I authored, by repository</text>
<text x="1166" y="34" fill="#6e7681" font-family="ui-monospace,Consolas,monospace" font-size="11" text-anchor="end">1,526 total &#183; square-root height scale &#183; 2026-08-01</text>

<!-- site floodlight -->
<path class="beam" d="M120 64 L40 262 L300 262 Z" fill="#ffd166" opacity=".2"/>

<!-- tower crane over the tallest -->
<g stroke="#ffb020" stroke-width="2.6" fill="none">
  <path d="M148 262V68"/>
  <path d="M140 244l8-8 8 8M140 200l8-8 8 8M140 156l8-8 8 8M140 112l8-8 8 8" stroke-width="1.3" stroke-opacity=".65"/>
  <g class="jib">
    <path d="M92 68h150"/>
    <path d="M148 54 L92 68M148 54 L226 68" stroke-width="1.5" stroke-opacity=".8"/>
    <path d="M148 54v14"/>
    <g class="load">
      <path d="M214 68v28" stroke="#e6edf3" stroke-width="1.2"/>
      <rect x="200" y="96" width="28" height="8" rx="2" fill="#8fa5cc" stroke="none"/>
    </g>
  </g>
</g>

