<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Viet Huynh, structural and systems engineer in Ha Noi. Animated drawing of a cable-stayed bridge under construction against a city skyline.">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#070b1a"/>
    <stop offset=".55" stop-color="#101c3f"/>
    <stop offset="1"   stop-color="#1a2b57"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0"   stop-color="#1f6feb" stop-opacity=".38"/>
    <stop offset=".5"  stop-color="#a371f7" stop-opacity=".14"/>
    <stop offset="1"   stop-color="#f85149" stop-opacity=".06"/>
  </linearGradient>
  <linearGradient id="cable" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0"   stop-color="#3fb950"/>
    <stop offset=".5"  stop-color="#58a6ff"/>
    <stop offset="1"   stop-color="#d29922"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#12306b"/>
    <stop offset="1" stop-color="#0a1836"/>
  </linearGradient>
  <pattern id="draft" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#8fb0ff" stroke-opacity=".07" stroke-width="1"/>
  </pattern>

  <style>
    .tw   { animation: tw 3.6s ease-in-out infinite; }
    .tw2  { animation: tw 5.1s ease-in-out infinite; animation-delay:-1.7s; }
    .win  { animation: win 6s steps(1,end) infinite; }
    .boom { transform-origin: 172px 230px; animation: swing 7s ease-in-out infinite; }
    .hook { animation: hoist 7s ease-in-out infinite; }
    .car  { animation: drive 6.5s linear infinite; }
    .carb { animation: driveb 8s linear infinite; }
    .sway { animation: sway 5s ease-in-out infinite; }

    @keyframes tw    { 0%,100%{opacity:.25} 50%{opacity:1} }
    @keyframes win   { 0%,45%{opacity:.15} 50%,100%{opacity:.9} }
    @keyframes swing { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-11deg)} }
    @keyframes hoist { 0%,100%{transform:translateY(0)} 45%{transform:translateY(20px)} 60%{transform:translateY(20px)} }
    @keyframes drive { 0%{transform:translateX(0);opacity:0} 6%{opacity:1} 94%{opacity:1} 100%{transform:translateX(700px);opacity:0} }
    @keyframes driveb{ 0%{transform:translateX(700px);opacity:0} 6%{opacity:1} 94%{opacity:1} 100%{transform:translateX(0);opacity:0} }
    @keyframes sway  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2.5px)} }

    .beacon { animation: blink 1.6s steps(1,end) infinite; }
    .barge  { animation: sail 17s linear infinite; }
    .cloud  { animation: drift 34s linear infinite; }
    .truck  { animation: haul 9s linear infinite; }
    .spark  { animation: weld .5s steps(1,end) infinite; }

    @keyframes blink { 0%,55%{opacity:1} 60%,100%{opacity:.12} }
    @keyframes sail  { 0%{transform:translateX(660px)} 100%{transform:translateX(-140px)} }
    @keyframes drift { 0%{transform:translateX(-160px)} 100%{transform:translateX(1260px)} }
    @keyframes haul  { 0%{transform:translateX(-70px)} 100%{transform:translateX(600px)} }
    @keyframes weld  { 0%,70%{opacity:0} 75%,100%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .tw,.tw2,.win,.boom,.hook,.car,.carb,.sway,
      .beacon,.barge,.cloud,.truck,.spark { animation: none; }
    }
  </style>
</defs>

<rect width="1200" height="320" rx="10" fill="url(#sky)"/>
<rect width="1200" height="320" rx="10" fill="url(#glow)"/>
<rect width="1200" height="320" rx="10" fill="url(#draft)"/>

<!-- stars -->
<g fill="#dce6ff">
  <circle class="tw"  cx="880"  cy="38" r="1.3"/><circle class="tw2" cx="1012" cy="26" r="1.1"/>
  <circle class="tw2" cx="742"  cy="30" r="1.2"/><circle class="tw"  cx="1128" cy="52" r="1.4"/>
  <circle class="tw"  cx="640"  cy="22" r="1"/>  <circle class="tw2" cx="956"  cy="64" r="1"/>
  <circle class="tw2" cx="1080" cy="18" r="1.2"/><circle class="tw"  cx="806"  cy="58" r="1"/>
</g>

<!-- far skyline -->
<g>
  <g>
    <rect x="596" y="150" width="34" height="106" fill="#0d1730"/>
    <g class="win" fill="#7aa2ff" fill-opacity=".85">
      <rect x="603" y="160" width="5" height="6"/><rect x="616" y="160" width="5" height="6"/>
      <rect x="603" y="176" width="5" height="6"/><rect x="616" y="192" width="5" height="6"/>
    </g>
  </g>
  <g>
    <rect x="638" y="120" width="26" height="136" fill="#101c3a"/>
    <rect x="647" y="104" width="8" height="18" fill="#101c3a"/>
    <g class="win" fill="#8ec9ff" fill-opacity=".8" style="animation-delay:-2s">
      <rect x="644" y="134" width="4" height="6"/><rect x="654" y="134" width="4" height="6"/>
      <rect x="644" y="150" width="4" height="6"/><rect x="654" y="172" width="4" height="6"/>
    </g>
  </g>
  <g>
    <rect x="672" y="166" width="44" height="90" fill="#0c1529"/>
    <g class="win" fill="#7aa2ff" fill-opacity=".7" style="animation-delay:-3.4s">
      <rect x="680" y="176" width="5" height="6"/><rect x="694" y="176" width="5" height="6"/>
      <rect x="680" y="194" width="5" height="6"/><rect x="694" y="212" width="5" height="6"/>
    </g>
  </g>
  <g>
    <rect x="1050" y="140" width="30" height="116" fill="#0e1832"/>
    <rect x="1086" y="176" width="40" height="80" fill="#0b1426"/>
    <g class="win" fill="#9fd0ff" fill-opacity=".75" style="animation-delay:-1s">
      <rect x="1057" y="152" width="5" height="6"/><rect x="1069" y="152" width="5" height="6"/>
      <rect x="1057" y="170" width="5" height="6"/><rect x="1095" y="188" width="5" height="6"/>
      <rect x="1109" y="188" width="5" height="6"/><rect x="1095" y="208" width="5" height="6"/>
    </g>
  </g>
  <!-- tower crane over the skyline -->
  <g stroke="#ffb020" stroke-width="2.2" fill="none" class="sway">
    <path d="M726 256V128"/><path d="M694 128h74"/><path d="M726 116v12"/>
    <path d="M700 128l26-12 26 12" stroke-width="1.6" stroke-opacity=".7"/>
    <path d="M708 128v14" stroke-width="1.4"/>
  </g>
</g>

<!-- drifting clouds -->
<g fill="#8fb0ff" fill-opacity=".07">
  <g class="cloud"><ellipse cx="60" cy="46" rx="46" ry="11"/><ellipse cx="92" cy="40" rx="30" ry="12"/></g>
  <g class="cloud" style="animation-delay:-19s"><ellipse cx="60" cy="74" rx="60" ry="9"/><ellipse cx="24" cy="68" rx="26" ry="10"/></g>
</g>

<!-- water -->
<rect x="560" y="256" width="640" height="64" fill="url(#water)"/>

<!-- barge passing under the deck -->
<g class="barge">
  <path d="M0 286h96l-9 12H9z" fill="#243458"/>
  <rect x="58" y="272" width="24" height="14" rx="2" fill="#31456f"/>
  <rect x="64" y="276" width="5" height="5" fill="#ffd166"/>
  <path d="M40 262v10" stroke="#8fa5cc" stroke-width="1.2"/>
  <circle cx="40" cy="260" r="2" fill="#f85149" class="beacon"/>
</g>
<g stroke="#4f86d6" stroke-opacity=".35" stroke-width="1.4" fill="none">
  <path d="M580 272h44M646 282h58M736 270h40M812 286h64M910 274h48M1000 284h56M1096 272h48"/>
</g>

<!-- cable-stayed bridge -->
<g>
  <!-- pylons -->
  <g fill="#c9d6f2">
    <path d="M846 246V88l7-10 7 10v158h-6V104h-2v142z" opacity=".92"/>
    <path d="M1046 246V118l6-9 6 9v128h-5V132h-2v114z" opacity=".85"/>
  </g>
  <circle cx="853" cy="76" r="2.6" fill="#f85149" class="beacon"/>
  <circle cx="1052" cy="107" r="2.4" fill="#f85149" class="beacon"/>
  <!-- stay cables -->
  <g stroke="url(#cable)" stroke-width="1.9" fill="none" stroke-linecap="round">
    <path d="M853 96 L700 236"/>
    <path d="M853 110 L748 236"/>
    <path d="M853 126 L792 236"/>
    <path d="M853 96 L1006 236"/>
    <path d="M853 110 L958 236"/>
    <path d="M853 126 L914 236"/>
    <path d="M1052 126 L1146 236"/>
    <path d="M1052 140 L1108 236"/>
  </g>
  <!-- deck -->
  <rect x="596" y="236" width="604" height="7" fill="#dbe6ff"/>
  <rect x="596" y="243" width="604" height="4" fill="#7f8db3"/>
  <g stroke="#5a6a92" stroke-width="1.2">
    <path d="M640 247v9M700 247v9M760 247v9M820 247v9M880 247v9M940 247v9M1000 247v9M1060 247v9M1120 247v9"/>
  </g>
  <!-- traffic -->
  <g class="car"><rect x="600" y="230" width="9" height="4" rx="1.6" fill="#ffe08a"/></g>
  <g class="car" style="animation-delay:-2.2s"><rect x="600" y="230" width="7" height="4" rx="1.6" fill="#fff3c4"/></g>
  <g class="car" style="animation-delay:-4.4s"><rect x="600" y="230" width="10" height="4" rx="1.6" fill="#ffd166"/></g>
  <g class="carb"><rect x="490" y="230" width="8" height="4" rx="1.6" fill="#ff8080"/></g>
  <g class="carb" style="animation-delay:-3.5s"><rect x="490" y="230" width="9" height="4" rx="1.6" fill="#ff6b6b"/></g>
</g>

<!-- haul road on site, trucks running -->
<g>
  <rect x="0" y="250" width="560" height="12" fill="#141d33"/>
  <path d="M0 256h560" stroke="#d29922" stroke-width="1" stroke-dasharray="10 12" stroke-opacity=".55"/>
  <g class="truck">
    <rect x="0" y="240" width="30" height="10" rx="2" fill="#3fb950"/>
    <rect x="30" y="236" width="14" height="14" rx="2" fill="#2ea043"/>
    <circle cx="9" cy="251" r="3.4" fill="#0b1426"/><circle cx="24" cy="251" r="3.4" fill="#0b1426"/>
    <circle cx="38" cy="251" r="3.4" fill="#0b1426"/>
  </g>
  <g class="truck" style="animation-delay:-4.5s">
    <rect x="0" y="242" width="24" height="8" rx="2" fill="#58a6ff"/>
    <rect x="24" y="238" width="12" height="12" rx="2" fill="#1f6feb"/>
    <circle cx="7" cy="251" r="3.2" fill="#0b1426"/><circle cx="31" cy="251" r="3.2" fill="#0b1426"/>
  </g>
</g>

<!-- crawler crane placing a girder. Kept below the text block on purpose. -->
<g>
  <rect x="140" y="246" width="66" height="14" rx="3" fill="#26324f"/>
  <circle cx="154" cy="260" r="4.6" fill="#1a2440"/><circle cx="172" cy="260" r="4.6" fill="#1a2440"/>
  <circle cx="190" cy="260" r="4.6" fill="#1a2440"/>
  <rect x="150" y="228" width="32" height="19" rx="3" fill="#ffb020"/>
  <g class="boom" stroke="#ffb020" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M172 230 L308 208"/>
    <path d="M172 230 L308 208" stroke="#0b1426" stroke-width="1" stroke-dasharray="6 9"/>
  </g>
  <g class="hook">
    <path d="M308 208 V228" stroke="#e6edf3" stroke-width="1.4" fill="none"/>
    <rect x="280" y="228" width="60" height="8" rx="2" fill="#8fa5cc"/>
    <rect x="280" y="228" width="60" height="3" rx="1.5" fill="#c9d6f2"/>
    <g class="spark" fill="#ffe08a"><circle cx="284" cy="238" r="2.2"/><circle cx="336" cy="238" r="1.8"/></g>
  </g>
  <circle cx="308" cy="205" r="2.4" fill="#f85149" class="beacon"/>
</g>

<!-- ground line + hatch (drawing convention) -->
<path d="M0 262h560" stroke="#6f7fa6" stroke-width="1.4"/>
<g stroke="#6f7fa6" stroke-width="1" stroke-opacity=".6">
  <path d="M8 262l-6 8M28 262l-6 8M48 262l-6 8M68 262l-6 8M88 262l-6 8M108 262l-6 8M128 262l-6 8M148 262l-6 8M168 262l-6 8M188 262l-6 8M208 262l-6 8M228 262l-6 8M248 262l-6 8M268 262l-6 8M288 262l-6 8M308 262l-6 8M328 262l-6 8M348 262l-6 8M368 262l-6 8M388 262l-6 8M408 262l-6 8M428 262l-6 8M448 262l-6 8M468 262l-6 8M488 262l-6 8M508 262l-6 8M528 262l-6 8M548 262l-6 8"/>
</g>

<!-- dimension line, drawing convention -->
<g stroke="#7f94c4" stroke-width="1" fill="none">
  <path d="M596 292h604"/>
  <path d="M596 286v12M1200 286v12M853 288v8M1052 288v8"/>
  <path d="M600 292l7-3.5v7zM1196 292l-7-3.5v7z" fill="#7f94c4" stroke="none"/>
</g>
<text x="898" y="308" fill="#8fa5cc" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.4">CABLE-STAYED &#183; SCHEMATIC</text>

<!-- text block -->
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="44" y="52" width="3" height="72" rx="1.5" fill="url(#cable)"/>
  <text x="62" y="98" fill="#f0f5ff" font-size="52" font-weight="700" letter-spacing="-1.7">Viet Huynh</text>
  <text x="64" y="126" fill="#8fa5cc" font-family="ui-monospace,Consolas,monospace" font-size="12" letter-spacing="2.7">STRUCTURAL &amp; SYSTEMS ENGINEER &#183; HA NOI</text>
  <text x="64" y="166" fill="#d6e2ff" font-size="18">I build the software structural engineers actually run.</text>
  <text x="64" y="192" fill="#7f94c4" font-size="14">Bridge foundations &#183; RC sections &#183; geotechnical pipelines &#183; optimizers &#183; agents</text>
</g>

<!-- drawing frame corner ticks -->
<g stroke="#5d6f99" stroke-width="1.4" fill="none" stroke-opacity=".8">
  <path d="M14 14h22M14 14v22M1186 14h-22M1186 14v22M14 306h22M14 306v-22M1186 306h-22M1186 306v-22"/>
</g>
<text x="1178" y="304" fill="#5d6f99" font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing="1.6" text-anchor="end">DWG 01 &#183; SCALE 1:100 &#183; REV 2026-08</text>
</svg>
