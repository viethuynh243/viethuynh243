<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Drawing sheet. Viet Huynh, structural and systems engineer in Ha Noi. Elevation of a cable-stayed bridge.">
<!-- Hallmark - pre-emit critique: P5 H5 E4 S5 R5 V5 -->
<defs>
  <pattern id="mm" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M10 0H0V10" fill="none" stroke="#dbe3ee" stroke-width=".6"/>
  </pattern>
  <pattern id="cm" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M50 0H0V50" fill="none" stroke="#c2cede" stroke-width=".9"/>
  </pattern>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width=".9" height="7" fill="#8c99ab"/>
  </pattern>
  <style>
    .truck { animation: run 11s linear infinite; }
    .barge { animation: sail 21s linear infinite; }
    .hook  { animation: hoist 8s ease-in-out infinite; }
    .jib   { transform-origin: 690px 84px; animation: slew 12s ease-in-out infinite; }
    .plot  { animation: plot 9s linear infinite; }

    /* Every keyframe set starts at the resting state, so a renderer that freezes
       on the first frame still shows a complete, correct drawing. */
    @keyframes run   { 0%{transform:translateX(0)} 100%{transform:translateX(676px)} }
    @keyframes sail  { 0%{transform:translateX(0)} 100%{transform:translateX(-560px)} }
    @keyframes hoist { 0%,100%{transform:translateY(0)} 50%{transform:translateY(38px)} }
    @keyframes slew  { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-7deg)} }
    @keyframes plot  { 0%{transform:translateX(0);opacity:0} 4%{opacity:.5} 96%{opacity:.5} 100%{transform:translateX(1120px);opacity:0} }
    @media (prefers-reduced-motion: reduce){ .truck,.barge,.hook,.jib,.plot{animation:none} }
  </style>
</defs>

<rect width="1200" height="340" fill="#ffffff"/>
<rect width="1200" height="340" fill="url(#mm)"/>
<rect width="1200" height="340" fill="url(#cm)"/>

<!-- sheet border, double rule as on a real drawing -->
<rect x="10" y="10" width="1180" height="320" fill="none" stroke="#1f2933" stroke-width="1.6"/>
<rect x="17" y="17" width="1166" height="306" fill="none" stroke="#1f2933" stroke-width=".7"/>

<!-- plotter sweep -->
<rect class="plot" x="26" y="18" width="1.4" height="304" fill="#0b57d0" opacity=".5"/>

<!-- notes block, left -->
<g>
  <path d="M44 52h340" stroke="#0b57d0" stroke-width="2.4"/>
  <text x="44" y="104" fill="#111927" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="-1.4">VIET HUYNH</text>
  <text x="46" y="128" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2.6">STRUCTURAL &amp; SYSTEMS ENGINEER &#183; HA NOI</text>
  <path d="M44 146h340" stroke="#c2cede" stroke-width="1"/>

  <text x="44" y="176" fill="#1f2933" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">I build the software structural</text>
  <text x="44" y="198" fill="#1f2933" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17">engineers actually run.</text>

  <g font-family="ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing=".4">
    <text x="44" y="230" fill="#5a6472">01  BRIDGE FOUNDATIONS &#183; RC SECTIONS</text>
    <text x="44" y="248" fill="#5a6472">02  GEOTECHNICAL PIPELINES</text>
    <text x="44" y="266" fill="#5a6472">03  OPTIMIZERS &#183; LLM AGENTS</text>
  </g>
</g>

<!-- elevation, right -->
<g>
  <rect x="530" y="252" width="630" height="30" fill="url(#hatch)" opacity=".28"/>
  <path d="M530 252h630" stroke="#0b57d0" stroke-width="1.1"/>

  <g class="barge">
    <path d="M1080 258h74l-8 12h-58z" fill="none" stroke="#5a6472" stroke-width="1.2"/>
    <rect x="1122" y="248" width="18" height="10" fill="none" stroke="#5a6472" stroke-width="1.2"/>
  </g>

  <path d="M446 252h84M1160 252h24" stroke="#1f2933" stroke-width="1.4"/>
  <g stroke="#8c99ab" stroke-width=".9">
    <path d="M454 252l-6 8M470 252l-6 8M486 252l-6 8M502 252l-6 8M518 252l-6 8M1168 252l-6 8M1182 252l-6 8"/>
  </g>

  <g fill="none" stroke="#1f2933" stroke-width="1.3">
    <path d="M752 232v20M768 232v20M1002 232v20M1018 232v20"/>
  </g>

  <path d="M470 226h690" stroke="#1f2933" stroke-width="1.6"/>
  <path d="M470 232h690" stroke="#1f2933" stroke-width="1.6"/>
  <path d="M470 229h690" stroke="#c5221f" stroke-width=".7" stroke-dasharray="14 5 3 5"/>

  <g fill="none" stroke="#1f2933" stroke-width="1.5">
    <path d="M752 232V70M768 232V70M752 96h16M752 130h16"/>
    <path d="M1002 232V116M1018 232V116M1002 136h16"/>
  </g>

  <g stroke="#0b57d0" stroke-width="1" fill="none">
    <path d="M756 74 L560 226M756 88 L616 226M756 102 L664 226"/>
    <path d="M764 74 L960 226M764 88 L904 226M764 102 L856 226"/>
    <path d="M1006 120 L1120 226M1006 134 L1068 226"/>
    <path d="M1014 120 L1160 226"/>
  </g>

  <g class="jib" stroke="#b06000" stroke-width="1.4" fill="none">
    <path d="M640 84h100M690 74v10"/>
    <path d="M690 74 L640 84M690 74 L740 84" stroke-width=".9"/>
  </g>
  <path d="M690 84v148" stroke="#b06000" stroke-width="1.4" fill="none"/>
  <g class="hook" stroke="#b06000" fill="none">
    <path d="M726 84v34" stroke-width=".9"/>
    <rect x="708" y="118" width="36" height="7" stroke-width="1.2"/>
  </g>

  <g class="truck" fill="none" stroke="#137333" stroke-width="1.2">
    <rect x="474" y="215" width="26" height="10"/><rect x="500" y="212" width="13" height="13"/>
  </g>
  <g class="truck" style="animation-delay:-5.5s" fill="none" stroke="#c5221f" stroke-width="1.2">
    <rect x="474" y="217" width="20" height="8"/>
  </g>

  <g stroke="#5a6472" stroke-width=".9" fill="none">
    <path d="M470 302h690"/>
    <path d="M470 292v18M760 296v14M1010 296v14M1160 292v18"/>
  </g>
  <g fill="#5a6472">
    <path d="M470 302l9-3.5v7zM1160 302l-9-3.5v7z"/>
  </g>
  <g font-family="ui-monospace,Consolas,monospace" font-size="9" fill="#5a6472" text-anchor="middle" letter-spacing="1">
    <text x="615" y="299">SIDE SPAN</text><text x="885" y="299">MAIN SPAN</text><text x="1085" y="299">SIDE SPAN</text>
  </g>
</g>

<!-- title block -->
<g stroke="#1f2933" stroke-width="1" fill="none">
  <path d="M44 286h340v36H44zM144 286v36M254 286v36"/>
</g>
<g font-family="ui-monospace,Consolas,monospace" font-size="8" fill="#5a6472" letter-spacing="1">
  <text x="52" y="299">DRAWN BY</text><text x="152" y="299">SHEET</text><text x="262" y="299">DATE</text>
</g>
<g font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#111927" letter-spacing=".6">
  <text x="52" y="315">V. HUYNH</text><text x="152" y="315">01 OF 01</text><text x="262" y="315">2026-08</text>
</g>
<text x="1160" y="315" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="8.5" letter-spacing="1.4" text-anchor="end">CABLE-STAYED CROSSING &#183; ELEVATION &#183; NTS</text>
</svg>
