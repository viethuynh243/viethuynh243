<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Viet Huynh — structural and systems engineer, Ha Noi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#0d1117"/>
      <stop offset=".55" stop-color="#12203c"/>
      <stop offset="1"   stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"   stop-color="#1f6feb"/>
      <stop offset=".45" stop-color="#3fb950"/>
      <stop offset=".75" stop-color="#d29922"/>
      <stop offset="1"   stop-color="#f85149"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#8b98bd" stroke-opacity=".085" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="210" rx="10" fill="url(#bg)"/>
  <rect width="1000" height="210" rx="10" fill="url(#grid)"/>

  <!-- P–M interaction envelope: the shape every column check comes down to -->
  <g transform="translate(700 22)">
    <path d="M40 14V152M40 152H244" fill="none" stroke="#8b98bd" stroke-opacity=".3" stroke-width="1.2"/>
    <path d="M40 15C86 18 128 47 146 81C158 103 162 116 143 134C124 152 86 165 40 166"
          fill="none" stroke="url(#spectrum)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#e6edf3" fill-opacity=".55">
      <circle cx="66" cy="62" r="2.4"/><circle cx="94" cy="96" r="2.4"/>
      <circle cx="72" cy="128" r="2.4"/><circle cx="112" cy="76" r="2.4"/>
    </g>
    <text x="44" y="10" fill="#8b98bd" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.2">P</text>
    <text x="244" y="150" fill="#8b98bd" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.2" text-anchor="end">M</text>
  </g>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="56" y="86" fill="#e6edf3" font-size="52" font-weight="700" letter-spacing="-1.6">Viet Huynh</text>
    <text x="58" y="116" fill="#9198a1" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="2.6">STRUCTURAL &amp; SYSTEMS ENGINEER &#183; HA NOI</text>
    <text x="58" y="156" fill="#c9d1d9" font-size="17">I build the software structural engineers actually run.</text>
    <text x="58" y="180" fill="#6e7681" font-size="14">Bridge foundations &#183; RC sections &#183; geotechnical pipelines &#183; optimizers &#183; agents</text>
  </g>

  <rect x="56" y="30" width="3" height="66" rx="1.5" fill="url(#spectrum)"/>
</svg>
