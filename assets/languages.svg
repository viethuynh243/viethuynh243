<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 252" width="1200" height="252" role="img" aria-label="Language breakdown across 20 repositories: Python 53.7 percent, C and C++ 19.3, C sharp 13.8, TypeScript 3.9, JavaScript 3.6, SQL 2.0, Dart 1.5, CSS 0.9, Go 0.7, PowerShell 0.4, Shell 0.1">
<!-- Hallmark - pre-emit critique: P5 H5 E5 S5 R5 V4 -->
<defs>
  <pattern id="l-mm" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M10 0H0V10" fill="none" stroke="#dbe3ee" stroke-width=".6"/>
  </pattern>
  <pattern id="l-cm" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M50 0H0V50" fill="none" stroke="#c2cede" stroke-width=".9"/>
  </pattern>
  <style>
    .dot { animation: pulse 1.4s ease-out .2s 1 both; }
    @keyframes pulse { from{opacity:.25} to{opacity:1} }
    @media (prefers-reduced-motion: reduce){ .dot{animation:none} }
  </style>
</defs>

<rect width="1200" height="252" fill="#ffffff"/>
<rect width="1200" height="252" fill="url(#l-mm)"/>
<rect width="1200" height="252" fill="url(#l-cm)"/>
<rect x="10" y="10" width="1180" height="232" fill="none" stroke="#1f2933" stroke-width="1.4"/>

<text x="40" y="40" fill="#111927" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing=".2">LANGUAGES</text>
<text x="1160" y="40" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="10" text-anchor="end">591,977 LINES OF CODE &#183; 20 REPOSITORIES &#183; FORKS AND PROSE EXCLUDED</text>
<path d="M40 50h1120" stroke="#c2cede" stroke-width="1"/>

<!-- stacked bar, static so the data always reads -->
<g stroke="#1f2933" stroke-width="1.1">
  <rect x="40"     y="70" width="601.8" height="24" fill="#4a86c8"/>
  <rect x="641.8"  y="70" width="216.6" height="24" fill="#f07f9e"/>
  <rect x="858.4"  y="70" width="154.0" height="24" fill="#4aa564"/>
  <rect x="1012.4" y="70" width="43.7"  height="24" fill="#6ba6e8"/>
  <rect x="1056.1" y="70" width="40.4"  height="24" fill="#e8d15a"/>
  <rect x="1096.5" y="70" width="22.4"  height="24" fill="#e8a33d"/>
  <rect x="1118.9" y="70" width="16.8"  height="24" fill="#4ec8c0"/>
  <rect x="1135.7" y="70" width="10.0"  height="24" fill="#9b7ad1"/>
  <rect x="1145.7" y="70" width="8.2"   height="24" fill="#6cc9e0"/>
  <rect x="1153.9" y="70" width="4.7"   height="24" fill="#7fa8e8"/>
  <rect x="1158.6" y="70" width="1.4"   height="24" fill="#a8d47a"/>
</g>

<!-- scale -->
<g stroke="#8c99ab" stroke-width=".9" fill="none">
  <path d="M40 94v8M320 94v5M600 94v8M880 94v5M1160 94v8"/>
</g>
<g fill="#8c99ab" font-family="ui-monospace,Consolas,monospace" font-size="8.5" letter-spacing="1">
  <text x="40" y="114">0%</text><text x="588" y="114">50%</text><text x="1160" y="114" text-anchor="end">100%</text>
</g>

<!-- legend, all eleven named, nothing rolled into an "other" bucket -->
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#1f2933">
  <g transform="translate(40 148)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#4a86c8" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">Python</text>
    <text x="270" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">53.7%</text>
  </g>
  <g transform="translate(40 180)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#f07f9e" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">C / C++</text>
    <text x="270" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">19.3%</text>
  </g>
  <g transform="translate(40 212)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#4aa564" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">C#</text>
    <text x="270" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">13.8%</text>
  </g>

  <g transform="translate(370 148)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#6ba6e8" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">TypeScript</text>
    <text x="270" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">3.9%</text>
  </g>
  <g transform="translate(370 180)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#e8d15a" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">JavaScript</text>
    <text x="270" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">3.6%</text>
  </g>
  <g transform="translate(370 212)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#e8a33d" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">SQL</text>
    <text x="270" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">2.0%</text>
  </g>

  <g transform="translate(700 148)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#4ec8c0" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">Dart</text>
    <text x="250" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">1.5%</text>
  </g>
  <g transform="translate(700 180)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#9b7ad1" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">CSS</text>
    <text x="250" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">0.9%</text>
  </g>
  <g transform="translate(700 212)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#6cc9e0" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">Go</text>
    <text x="250" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">0.7%</text>
  </g>

  <g transform="translate(1000 148)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#7fa8e8" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">PowerShell</text>
    <text x="160" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">0.4%</text>
  </g>
  <g transform="translate(1000 180)">
    <rect class="dot" x="0" y="-11" width="12" height="12" fill="#a8d47a" stroke="#1f2933" stroke-width="1"/><text x="26" y="0">Shell</text>
    <text x="160" y="0" fill="#5a6472" font-family="ui-monospace,Consolas,monospace" font-size="11.5" text-anchor="end">0.1%</text>
  </g>
</g>
</svg>
