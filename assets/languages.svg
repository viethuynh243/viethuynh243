<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 268" width="1200" height="268" role="img" aria-label="Language breakdown across 20 repositories: Python 53.7 percent, C and C++ 19.3, C sharp 13.8, TypeScript 3.9, JavaScript 3.6, SQL 2.0, Dart 1.5, CSS 0.9, Go 0.7, PowerShell 0.4, Shell 0.1">
<!-- Hallmark - pre-emit critique: P5 H5 E4 S5 R4 V5 -->
<defs>
  <linearGradient id="l-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#080d1e"/><stop offset="1" stop-color="#101a35"/>
  </linearGradient>
  <pattern id="l-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#8fb0ff" stroke-opacity=".06"/>
  </pattern>
  <clipPath id="l-round"><rect x="60" y="84" width="1080" height="26" rx="6"/></clipPath>
  <!-- The bar is revealed by a wipe. The rect ships at full width, so a browser that
       ignores the animation still shows the complete bar rather than an empty one. -->
  <clipPath id="l-wipe"><rect class="wipe" x="60" y="84" width="1080" height="26"/></clipPath>
  <style>
    /* Runs once and holds. An infinite loop would leave the chart empty or
       half-drawn much of the time, and this one carries data. */
    .wipe { animation: wipe 1.5s cubic-bezier(.16,.9,.28,1) .2s 1 both; }
    .dot  { animation: pulse 1.5s ease-out .2s 1 both; }
    @keyframes wipe  { from{width:0} to{width:1080px} }
    @keyframes pulse { 0%{opacity:.2} 100%{opacity:1} }
    @media (prefers-reduced-motion: reduce){ .wipe,.dot{animation:none} }
  </style>
</defs>

<rect width="1200" height="268" rx="10" fill="url(#l-bg)"/>
<rect width="1200" height="268" rx="10" fill="url(#l-grid)"/>

<!-- drawing frame ticks -->
<g stroke="#5d6f99" stroke-width="1.3" fill="none" stroke-opacity=".75">
  <path d="M14 14h20M14 14v20M1186 14h-20M1186 14v20M14 254h20M14 254v-20M1186 254h-20M1186 254v-20"/>
</g>

<text x="60" y="46" fill="#e6edf3" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="-.2">Languages</text>
<text x="1140" y="46" fill="#6e7681" font-family="ui-monospace,Consolas,monospace" font-size="11" text-anchor="end">591,977 lines of code &#183; 20 repositories &#183; forks and prose excluded</text>
<path d="M60 58h1080" stroke="#30363d"/>

<!-- stacked bar. Each segment wipes in from the left. -->
<g clip-path="url(#l-round)">
  <g clip-path="url(#l-wipe)">
    <rect x="60"     y="84" width="580.3" height="26" fill="#3572A5"/>
    <rect x="640.3"  y="84" width="208.9" height="26" fill="#f34b7d"/>
    <rect x="849.2"  y="84" width="148.5" height="26" fill="#178600"/>
    <rect x="997.7"  y="84" width="42.1"  height="26" fill="#3178c6"/>
    <rect x="1039.8" y="84" width="39.0"  height="26" fill="#f1e05a"/>
    <rect x="1078.8" y="84" width="21.6"  height="26" fill="#e38c00"/>
    <rect x="1100.4" y="84" width="16.2"  height="26" fill="#00B4AB"/>
    <rect x="1116.6" y="84" width="9.6"   height="26" fill="#663399"/>
    <rect x="1126.2" y="84" width="7.9"   height="26" fill="#00ADD8"/>
    <rect x="1134.1" y="84" width="4.5"   height="26" fill="#5391FE"/>
    <rect x="1138.6" y="84" width="1.5"   height="26" fill="#89e051"/>
  </g>
</g>

<!-- scale, drawing convention -->
<g stroke="#5d6f99" stroke-width="1" stroke-opacity=".55" fill="none">
  <path d="M60 114v8M330 114v6M600 114v8M870 114v6M1140 114v8"/>
</g>
<g fill="#5d6f99" font-family="ui-monospace,Consolas,monospace" font-size="9" letter-spacing="1">
  <text x="60" y="134">0%</text><text x="588" y="134">50%</text><text x="1140" y="134" text-anchor="end">100%</text>
</g>

<!-- legend, all eleven listed, nothing rolled into an "other" bucket -->
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#c9d1d9">
  <g transform="translate(60 176)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#3572A5"/><text x="26" y="0">Python</text>
    <text x="300" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">53.7%</text>
  </g>
  <g transform="translate(60 210)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#f34b7d" style="animation-delay:-.1s"/><text x="26" y="0">C / C++</text>
    <text x="300" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">19.3%</text>
  </g>
  <g transform="translate(60 244)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#178600" style="animation-delay:-.2s"/><text x="26" y="0">C#</text>
    <text x="300" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">13.8%</text>
  </g>

  <g transform="translate(430 176)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#3178c6" style="animation-delay:-.3s"/><text x="26" y="0">TypeScript</text>
    <text x="300" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">3.9%</text>
  </g>
  <g transform="translate(430 210)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#f1e05a" style="animation-delay:-.4s"/><text x="26" y="0">JavaScript</text>
    <text x="300" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">3.6%</text>
  </g>
  <g transform="translate(430 244)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#e38c00" style="animation-delay:-.5s"/><text x="26" y="0">SQL</text>
    <text x="300" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">2.0%</text>
  </g>

  <g transform="translate(800 176)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#00B4AB" style="animation-delay:-.6s"/><text x="26" y="0">Dart</text>
    <text x="340" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">1.5%</text>
  </g>
  <g transform="translate(800 210)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#663399" style="animation-delay:-.7s"/><text x="26" y="0">CSS</text>
    <text x="340" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">0.9%</text>
  </g>
  <g transform="translate(800 244)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#00ADD8" style="animation-delay:-.8s"/><text x="26" y="0">Go</text>
    <text x="340" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">0.7%</text>
  </g>

  <g transform="translate(1010 176)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#5391FE" style="animation-delay:-.9s"/><text x="26" y="0">PowerShell</text>
    <text x="130" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">0.4%</text>
  </g>
  <g transform="translate(1010 210)">
    <circle class="dot" cx="7" cy="-5" r="7" fill="#89e051" style="animation-delay:-1s"/><text x="26" y="0">Shell</text>
    <text x="130" y="0" fill="#8b949e" font-family="ui-monospace,Consolas,monospace" font-size="12" text-anchor="end">0.1%</text>
  </g>
</g>
</svg>
