<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 46" width="1200" height="46" role="img" aria-label="Chrome offline dinosaur game: a T-Rex runs and jumps over cacti">
<defs>
  <style>
    .field { animation: scroll 2.8s linear infinite; }
    .hop   { animation: hop    2.8s linear infinite; }
    .legA  { animation: flipA  .3s  linear infinite; }
    .legB  { animation: flipB  .3s  linear infinite; }
    @keyframes scroll { from{transform:translateX(0)} to{transform:translateX(-420px)} }
    @keyframes hop {
      0%,18%   { transform:translateY(0) }
      27%      { transform:translateY(-9px) }
      33%      { transform:translateY(-11px) }
      39%      { transform:translateY(-9px) }
      46%,100% { transform:translateY(0) }
    }
    @keyframes flipA { 0%,49.9%{opacity:1} 50%,100%{opacity:0} }
    @keyframes flipB { 0%,49.9%{opacity:0} 50%,100%{opacity:1} }
    @media (prefers-reduced-motion: reduce){
      .field,.hop,.legA,.legB{animation:none}
      .legB{opacity:0}
    }
  </style>
</defs>

<rect width="1200" height="46" fill="#ffffff"/>

<!-- score readout, same monospace family as the road-plan chainage labels it replaces -->
<text x="1194" y="9" text-anchor="end" font-family="ui-monospace,Consolas,monospace"
      font-size="8" letter-spacing="1.5" fill="#8c99ab">HI 09999&#160;&#160;&#160;01337</text>

<!-- solid ground -->
<path d="M0 40h1200" stroke="#1f2933" stroke-width="1.2"/>

<!-- everything that scrolls under the dino: surface texture + cacti -->
<g class="field">
  <path d="M-300 39H1560" stroke="#1f2933" stroke-width="1" stroke-dasharray="5 79"/>
  <g fill="#1f2933">
    <!-- cactus, double-arm -->
    <rect x="-210" y="30" width="4" height="10"/>
    <rect x="-213" y="33" width="2" height="4"/><rect x="-213" y="33" width="3" height="1.6"/>
    <rect x="-205" y="31" width="2" height="5"/><rect x="-206" y="34" width="3" height="1.6"/>
    <!-- cactus, single + arm (the one squarely in the dino's path) -->
    <rect x="210" y="31" width="4" height="9"/>
    <rect x="215" y="33" width="2" height="4"/><rect x="214" y="35" width="3" height="1.6"/>
    <!-- cactus, double-arm -->
    <rect x="630" y="30" width="4" height="10"/>
    <rect x="627" y="33" width="2" height="4"/><rect x="627" y="33" width="3" height="1.6"/>
    <rect x="635" y="31" width="2" height="5"/><rect x="634" y="34" width="3" height="1.6"/>
    <!-- cactus, short pair -->
    <rect x="1050" y="34" width="3" height="6"/>
    <rect x="1055" y="32" width="3" height="8"/>
    <!-- cactus, single + arm -->
    <rect x="1470" y="31" width="4" height="9"/>
    <rect x="1475" y="33" width="2" height="4"/><rect x="1474" y="35" width="3" height="1.6"/>
  </g>
</g>

<!-- the T-Rex: fixed in x, its inner group hops in sync with a cactus reaching it -->
<g transform="translate(58,14.7) scale(1.15)">
  <g class="hop">
    <g fill="#1f2933">
      <rect x="0"  y="7"  width="3"  height="2"/>   <!-- tail tip -->
      <rect x="0"  y="9"  width="6"  height="3"/>   <!-- tail base -->
      <rect x="3"  y="10" width="13" height="6"/>   <!-- torso -->
      <rect x="6"  y="7"  width="11" height="4"/>   <!-- neck -->
      <rect x="10" y="0"  width="11" height="8"/>   <!-- head -->
      <rect x="16" y="8"  width="5"  height="2"/>   <!-- jaw -->
      <rect x="13" y="11" width="3"  height="1"/>   <!-- arm -->
      <rect x="5"  y="16" width="9"  height="2"/>   <!-- hips -->
    </g>
    <g class="legA" fill="#1f2933">
      <rect x="5"  y="18" width="3" height="4"/><rect x="5"  y="21" width="4" height="1"/>
      <rect x="11" y="18" width="3" height="1"/>
    </g>
    <g class="legB" fill="#1f2933">
      <rect x="5"  y="18" width="3" height="1"/>
      <rect x="11" y="18" width="3" height="4"/><rect x="11" y="21" width="4" height="1"/>
    </g>
    <g fill="#ffffff">
      <rect x="17" y="2" width="2" height="2"/>     <!-- eye -->
      <rect x="17" y="6" width="4" height="1"/>     <!-- mouth -->
    </g>
  </g>
</g>
</svg>
