<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 46" width="1200" height="46" role="img" aria-label="Road plan strip with chainage marks">
<defs>
  <style>
    .lane { animation: run 3s linear infinite; }
    .roll { animation: cross 18s linear infinite; }
    @keyframes run   { 0%{transform:translateX(0)} 100%{transform:translateX(-60px)} }
    @keyframes cross { 0%{transform:translateX(0)} 100%{transform:translateX(1200px)} }
    @media (prefers-reduced-motion: reduce){ .lane,.roll{animation:none} }
  </style>
</defs>

<rect width="1200" height="46" fill="#ffffff"/>

<path d="M0 14h1200M0 36h1200" stroke="#1f2933" stroke-width="1.2"/>

<g clip-path="inset(14px 0 10px 0)">
  <g class="lane">
    <path d="M-60 25h30M0 25h30M60 25h30M120 25h30M180 25h30M240 25h30M300 25h30M360 25h30M420 25h30M480 25h30M540 25h30M600 25h30M660 25h30M720 25h30M780 25h30M840 25h30M900 25h30M960 25h30M1020 25h30M1080 25h30M1140 25h30M1200 25h30"
          stroke="#b06000" stroke-width="1.6"/>
  </g>
</g>

<g stroke="#8c99ab" stroke-width=".9" fill="none">
  <path d="M100 8v6M300 8v6M500 8v6M700 8v6M900 8v6M1100 8v6"/>
  <path d="M100 36v6M300 36v6M500 36v6M700 36v6M900 36v6M1100 36v6"/>
</g>
<g fill="#8c99ab" font-family="ui-monospace,Consolas,monospace" font-size="7.5" letter-spacing="1" text-anchor="middle">
  <text x="100" y="6">KM0+000</text><text x="300" y="6">KM0+200</text><text x="500" y="6">KM0+400</text>
  <text x="700" y="6">KM0+600</text><text x="900" y="6">KM0+800</text><text x="1100" y="6">KM1+000</text>
</g>

<g class="roll" fill="none" stroke="#1f2933" stroke-width="1.2">
  <rect x="0" y="13" width="24" height="9"/>
  <circle cx="6" cy="27" r="5"/>
  <circle cx="19" cy="26" r="4"/>
</g>
</svg>
